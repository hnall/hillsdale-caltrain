<script>
const DAYPARTS = (function () {
  const TZ = "America/Los_Angeles";
  const min = (h, m = 0) => h * 60 + m;
  const STAGES = [
    { id: "school", from: 0, height: 0 },
    { id: "half", from: min(11), height: 400 },
    { id: "more", from: min(13, 30), height: 560 },
    { id: "all", from: min(14, 45), height: 800 },
  ];
  const LUNCH_SWITCH = min(13);
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: TZ, hourCycle: "h23", weekday: "short",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
  });
  function local(at) {
    const o = {};
    for (const p of fmt.formatToParts(new Date(at * 1000))) o[p.type] = p.value;
    const hh = +o.hour % 24, mm = +o.minute;
    return { ymd: `${o.year}-${o.month}-${o.day}`, hh, mm, minutes: hh * 60 + mm, weekend: o.weekday === "Sat" || o.weekday === "Sun" };
  }
  const toMin = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + (m || 0); };
  function stage(at, times) {
    const l = local(at);
    if (l.weekend || l.minutes < min(4)) return STAGES[3];
    const from = s => (times && times[s.id] ? toMin(times[s.id]) : s.from);
    let s = STAGES[0];
    for (const x of STAGES) if (l.minutes >= from(x)) s = x;
    return s;
  }
  return { TZ, STAGES, LUNCH_SWITCH, local, stage, toMin };
})();
const SCHOOL_CORE = (function (DP) {
  const pad = n => String(n).padStart(2, "0");
  function addDays(ymd, n) {
    const d = new Date(`${ymd}T12:00:00Z`);
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  const dayName = ymd => new Date(`${ymd}T12:00:00Z`).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "long" });
  const dateLabel = ymd => new Date(`${ymd}T12:00:00Z`).toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
  function describe(code, night) {
    if (code == null) return { label: "", icon: "cloud" };
    const c = +code;
    if (c <= 1) return { label: c ? "Mostly clear" : "Clear", icon: night ? "moon" : "sun" };
    if (c === 2) return { label: "Partly cloudy", icon: night ? "cloud-moon" : "cloud-sun" };
    if (c === 3) return { label: "Cloudy", icon: "cloud" };
    if (c === 45 || c === 48) return { label: "Fog", icon: "fog" };
    if (c >= 51 && c <= 57) return { label: "Drizzle", icon: "rain" };
    if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return { label: c >= 80 ? "Showers" : "Rain", icon: "rain" };
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return { label: "Snow", icon: "snow" };
    if (c >= 95) return { label: "Thunderstorms", icon: "storm" };
    return { label: "", icon: "cloud" };
  }
  const isNight = hh => hh < 7 || hh >= 18;
  function weather(l, om) {
    if (!om || !om.hourly) return null;
    const h = om.hourly, times = h.time || [], d = om.daily || {};
    const i = times.indexOf(`${l.ymd}T${pad(l.hh)}:00`);
    const rain = j => (h.precipitation_probability ? h.precipitation_probability[j] : null);
    const now = i >= 0 && h.temperature_2m[i] != null
      ? { temp: Math.round(h.temperature_2m[i]), rainChance: rain(i), ...describe(h.weather_code[i], isNight(l.hh)) } : null;
    const di = (d.time || []).indexOf(l.ymd);
    const today = di >= 0 && d.temperature_2m_max[di] != null && d.temperature_2m_min[di] != null
      ? { hi: Math.round(d.temperature_2m_max[di]), lo: Math.round(d.temperature_2m_min[di]) } : null;
    if (!now && !today) return null;
    const hours = [];
    for (let j = i + 1; i >= 0 && j < times.length && hours.length < 24; j++) {
      if (h.temperature_2m[j] == null) continue;
      const hh = +times[j].slice(11, 13);
      hours.push({ time: times[j], hh, temp: Math.round(h.temperature_2m[j]), rainChance: rain(j), ...describe(h.weather_code[j], isNight(hh)) });
    }
    const rest = hours.filter(x => x.time.slice(0, 10) === l.ymd);
    const restOfDayRain = Math.max(now ? now.rainChance || 0 : 0, ...rest.map(x => x.rainChance || 0));
    return { now, today, restOfDayRain, hours };
  }
  const LABELS = { omnivore: "Main", vegetarian: "Vegetarian", vegan: "Vegan", sandwich: "Sandwich", salad: "Salad", soup: "Soup" };
  const ORDER = ["omnivore", "vegetarian", "vegan", "soup", "sandwich", "salad"];
  function dishName(s) {
    const parts = s.split(/,|\s+with\s+|\s+-\s+|-(?=[A-Z])|\s+in\s+a\s+|\s+on\s+a\s+|\s+served\s+|\s+(?:seasoned|rubbed|marinated)\s+in\s+/i)
      .map(x => x.trim()).filter(Boolean)
      .map(x => x.replace(/^marinated in .*?spices\s+(?!and\b)/i, ""));
    let i = 0;
    while (i < parts.length - 1 && (/^marinated in\b/i.test(parts[i]) || /\bsauce$/i.test(parts[i]))) i++;
    const cut = parts[i] || s;
    return cut.length >= 6 ? cut : s;
  }
  function menuFor(day) {
